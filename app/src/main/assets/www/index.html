<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة بيور - عرض البيانات المرفوعة</title>
    <!-- استدعاء خط وفونت وأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 15px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.4rem;
            color: #e50914;
        }
        .stats {
            font-size: 0.85rem;
            background: #222;
            padding: 5px 12px;
            border-radius: 15px;
            color: #aaa;
        }
        /* شبكة بطاقات المانجا */
        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }
        .manga-card {
            background: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s;
        }
        .manga-card:active {
            transform: scale(0.96);
        }
        .cover-wrapper {
            position: relative;
            width: 100%;
            height: 190px;
            background: #2a2a2a;
        }
        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .badge-type {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(229, 9, 20, 0.85);
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge-chapter {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: #4cd137;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .info {
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }
        .title {
            font-size: 0.85rem;
            font-weight: bold;
            line-height: 1.2;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #ddd;
        }
        .status {
            font-size: 0.7rem;
            color: #888;
        }
        #loading {
            text-align: center;
            padding: 5px;
            color: #ff9f43;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 مكتبة بيور (معاينة)</h1>
        <div class="stats" id="count">العدد: 0</div>
    </header>

    <div id="loading">جاري جلب الأعمال من قواعد البيانات... 🔄</div>
    
    <div class="manga-grid" id="mangaGrid"></div>

    <!-- استدعاء خدمات Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ استبدل هذه الإعدادات بمعلومات مشروعك بـ Firebase ⚠️
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // تهيئة الفايربيس
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const mangaGrid = document.getElementById('mangaGrid');
        const loading = document.getElementById('loading');
        const countElem = document.getElementById('count');

        // الربط المباشر بجدول manga
        const mangaRef = collection(db, "manga");
        
        onSnapshot(mangaRef, (snapshot) => {
            mangaGrid.innerHTML = "";
            loading.style.display = "none";
            countElem.innerText = `العدد: ${snapshot.docs.length}`;

            if (snapshot.empty) {
                mangaGrid.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>لا توجد مانغا مرفوعة حتى الآن!</p>";
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                
                // استخراج الحقول مع دعم التسميات العربية والانكليزية
                const title = data.title || data.عنوان || "بدون عنوان";
                const cover = data.cover || data.غطاء || "https://via.placeholder.com/150x200?text=No+Cover";
                const type = data.type || "مانهوا";
                const chapter = data.latestChapter || "الفصل 1";
                const status = data.status || "مستمر";

                // بناء بطاقة المانجا
                const card = document.createElement('div');
                card.className = 'manga-card';
                card.innerHTML = `
                    <div class="cover-wrapper">
                        <img class="cover-img" src="${cover}" alt="${title}" onerror="this.src='https://via.placeholder.com/150x200?text=Error';">
                        <span class="badge-type">${type}</span>
                        <span class="badge-chapter">${chapter}</span>
                    </div>
                    <div class="info">
                        <div class="title">${title}</div>
                        <div class="status">الحالة: ${status}</div>
                    </div>
                `;
                mangaGrid.appendChild(card);
            });
        }, (error) => {
            console.error("خطأ بالربط:", error);
            loading.innerText = "❌ حدث خطأ أثناء جلب البيانات! تأكد من قواعد الحماية (Rules).";
        });
    </script>
</body>
</html>
